# Set the Application name (shown in user launcher) here.
app.name=L\u00D6VE for Android

# Set the application ID here. Application ID must be unique for every app in Android.
# https://developer.android.com/build/configure-app-module#set-application-id
app.application_id=org.love2d.android
# Some users want to make portrait games in LOVE.
# Although it's preferred to set the orientation through love.window.setMode, some users
# reported reliability issue with it.
app.orientation=landscape
# Application version code. Incrementing this means "update". If user tires to install an app
# with lower version_code, it will be rejected.
app.version_code=33
# Version text to be shown in the Android app settings.
app.version_name=12.0

# No need to modify anything past this line!
android.enableJetifier=false
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.dependency.useConstraints=true
